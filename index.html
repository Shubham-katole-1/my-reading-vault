<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VaultScans - Browse Library</title>
  
  <!-- Tailwind CSS CDN for modern styling without installation -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0b0e14] text-slate-200 min-h-screen font-sans antialiased pb-12">

  <!-- ========================================== -->
  <!-- 1. NAVIGATION BAR                          -->
  <!-- ========================================== -->
  <nav class="bg-[#121721] border-b border-slate-800/80 sticky top-0 z-50 backdrop-blur-md bg-opacity-90">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      
      <!-- Brand Logo -->
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-lg bg-blue-600 flex items-center justify-center font-black text-white text-xl shadow-lg shadow-blue-500/30">
          V
        </div>
        <span class="font-extrabold text-xl tracking-wider text-white uppercase">
          Vault<span class="text-blue-500">Scans</span>
        </span>
      </div>

      <!-- App Subtitle Badge -->
      <div class="text-xs font-medium text-slate-400 bg-slate-800/60 px-3 py-1.5 rounded-full border border-slate-700/50 hidden sm:block">
        Personal Reading Library
      </div>

    </div>
  </nav>

  <!-- ========================================== -->
  <!-- 2. MAIN CONTENT AREA                       -->
  <!-- ========================================== -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-8">

    <!-- PAGE HEADER & SEARCH BAR -->
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
      <div>
        <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">Browse Library</h1>
        <p class="text-slate-400 text-sm mt-1">Explore your collection of Manhwa, Manga, Novels, and Movies.</p>
      </div>

      <!-- Live Search Input Box -->
      <div class="relative w-full md:w-80">
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Search by title..." 
          class="w-full bg-[#121721] border border-slate-700/80 rounded-xl px-4 py-2.5 pl-10 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition"
        />
        <!-- Search Glass Icon -->
        <svg class="w-4 h-4 absolute left-3.5 top-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
      </div>
    </div>

    <!-- FILTER BAR PANEL (Categories, Genre, Status, Sort) -->
    <div class="bg-[#121721] border border-slate-800 rounded-2xl p-4 sm:p-5 mb-8 shadow-xl">
      
      <!-- Top Row: Category Buttons (All, Manhwa, Manga, etc.) -->
      <div class="mb-5">
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-2.5">Category</label>
        <div id="categoryContainer" class="flex gap-2 overflow-x-auto pb-1 scrollbar-none">
          <!-- Category buttons will be dynamically rendered here by app.js -->
        </div>
      </div>

      <!-- Bottom Row: Dropdown Filters -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 pt-4 border-t border-slate-800/80">
        
        <!-- Genre Filter -->
        <div>
          <label for="genreSelect" class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1.5">Genre</label>
          <select id="genreSelect" class="w-full bg-[#0b0e14] border border-slate-700/80 text-sm text-slate-200 rounded-xl px-3.5 py-2.5 focus:outline-none focus:border-blue-500 cursor-pointer">
            <!-- Genre options will be dynamically populated by app.js -->
          </select>
        </div>

        <!-- Status Filter -->
        <div>
          <label for="statusSelect" class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1.5">Status</label>
          <select id="statusSelect" class="w-full bg-[#0b0e14] border border-slate-700/80 text-sm text-slate-200 rounded-xl px-3.5 py-2.5 focus:outline-none focus:border-blue-500 cursor-pointer">
            <option value="All">All Statuses</option>
            <option value="Ongoing">Ongoing</option>
            <option value="Completed">Completed</option>
          </select>
        </div>

        <!-- Sort Filter -->
        <div>
          <label for="sortSelect" class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1.5">Sort By</label>
          <select id="sortSelect" class="w-full bg-[#0b0e14] border border-slate-700/80 text-sm text-slate-200 rounded-xl px-3.5 py-2.5 focus:outline-none focus:border-blue-500 cursor-pointer">
            <option value="default">Default</option>
            <option value="rating-desc">Highest Rated</option>
            <option value="title-asc">Title (A - Z)</option>
          </select>
        </div>

      </div>
    </div>

    <!-- ========================================== -->
    <!-- 3. MEDIA CARDS DISPLAY GRID                -->
    <!-- ========================================== -->
    <div id="mediaGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 sm:gap-6">
      <!-- Cards generated from data.json will appear here -->
    </div>

  </main>

  <!-- Connect to JavaScript file -->
  <script src="app.js"></script>
</body>
</html>
